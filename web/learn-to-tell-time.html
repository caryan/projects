<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Time Is It? - Learn to Tell Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        /* Engineering-pad design tokens (shared site identity) */
        :root {
            --paper: #EEF2E3;
            --grid-minor: rgba(90, 120, 84, 0.13);
            --grid-major: rgba(90, 120, 84, 0.22);
            --surface: #F6F8ED;
            --well: #EAEEDC;
            --ink: #243240;
            --ink-soft: #5C6A5E;
            --muted: #656F5B;
            --line: rgba(36, 50, 64, 0.30);
            --line-faint: rgba(36, 50, 64, 0.16);
            --copper: #9A5527;
            --copper-strong: #8C4E26;
            --copper-contrast: #ffffff;
            --good: #3E7A4E;
            --good-contrast: #ffffff;
            --bad: #B04438;
            --crayon-blue: #3E74C0;
            --crayon-red: #D0453A;
            --serif: "STIX Two Text", "Times New Roman", serif;
            --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #191F1A;
                --grid-minor: rgba(190, 215, 185, 0.055);
                --grid-major: rgba(190, 215, 185, 0.10);
                --surface: #212822;
                --well: #1A201B;
                --ink: #DEE5D2;
                --ink-soft: #95A291;
                --muted: #7E8A7A;
                --line: rgba(222, 229, 210, 0.30);
                --line-faint: rgba(222, 229, 210, 0.14);
                --copper: #D28E58;
                --copper-strong: #E2A46E;
                --copper-contrast: #191F1A;
                --good: #7FB98B;
                --good-contrast: #191F1A;
                --bad: #E09C90;
                --crayon-blue: #7FA8E0;
                --crayon-red: #E28078;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--serif);
            background-color: var(--paper);
            background-image:
                linear-gradient(var(--grid-major) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
                linear-gradient(var(--grid-minor) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
            background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        :focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }

        .site-nav {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        .site-nav a { color: var(--copper); text-decoration: none; }
        .site-nav a:hover { color: var(--copper-strong); text-decoration: underline; }
        .site-nav .sheet-tag { color: var(--muted); }

        .card {
            background: var(--surface);
            border: 1px solid var(--line-faint);
            border-radius: 2px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 30px;
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--ink);
            text-align: center;
        }

        .subtitle {
            font-size: 1rem;
            font-style: italic;
            color: var(--ink-soft);
            text-align: center;
            margin-top: -12px;
        }

        /* Level selector */
        .level-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .level-btn {
            padding: 6px 14px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: var(--well);
            color: var(--ink-soft);
            font-family: var(--mono);
            font-size: 0.78rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .level-btn:hover {
            border-color: var(--copper);
            color: var(--copper-strong);
        }

        .level-btn.active {
            background: var(--copper);
            color: var(--copper-contrast);
            border-color: var(--copper);
        }

        /* Streak */
        .streak-display {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 1.1rem;
            min-height: 28px;
            margin-bottom: -12px;
        }

        .streak-display .star {
            display: inline-block;
            transition: transform 0.3s;
        }

        .streak-display .star.pop {
            animation: starPop 0.4s ease;
        }

        @keyframes starPop {
            0% { transform: scale(0); }
            60% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        /* Clock */
        .clock-container {
            position: relative;
        }

        canvas {
            display: block;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.9rem;
            color: var(--ink-soft);
            margin-top: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-swatch {
            width: 24px;
            height: 6px;
            border-radius: 3px;
        }

        .legend-swatch.hour {
            background: var(--crayon-blue);
            height: 8px;
        }

        .legend-swatch.minute {
            background: var(--crayon-red);
        }

        /* Inputs */
        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .input-group label {
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        .input-group input {
            width: 72px;
            height: 52px;
            text-align: center;
            font-family: var(--mono);
            font-size: 1.5rem;
            color: var(--ink);
            background: var(--well);
            border: 2px solid var(--line);
            border-radius: 2px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--copper);
        }

        .colon {
            font-family: var(--mono);
            font-size: 2rem;
            font-weight: bold;
            color: var(--ink-soft);
            margin-top: 16px;
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 2px;
            font-family: var(--mono);
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            min-width: 140px;
            min-height: 48px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-check {
            background: var(--copper);
            color: var(--copper-contrast);
        }

        .btn-check:hover {
            background: var(--copper-strong);
        }

        .btn-next {
            background: var(--good);
            color: var(--good-contrast);
            display: none;
        }

        .btn-next:hover {
            filter: brightness(1.08);
        }

        /* Feedback */
        .feedback {
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            min-height: 30px;
            transition: opacity 0.3s;
        }

        .feedback.correct {
            color: var(--good);
        }

        .feedback.incorrect {
            color: var(--bad);
        }

        /* Animations */
        @keyframes correctPulse {
            0% { box-shadow: 0 0 0 0 rgba(62, 122, 78, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(62, 122, 78, 0); }
            100% { box-shadow: 0 0 0 0 rgba(62, 122, 78, 0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .clock-correct {
            animation: correctPulse 0.6s ease;
            border-radius: 50%;
        }

        .clock-shake {
            animation: shake 0.5s ease;
        }

        .level-up-msg {
            font-size: 1rem;
            color: var(--copper-strong);
            font-weight: 600;
            text-align: center;
            animation: starPop 0.5s ease;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        footer a {
            color: var(--copper);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (prefers-reduced-motion: reduce) {
            .streak-display .star.pop,
            .clock-correct,
            .clock-shake,
            .level-up-msg { animation: none; }
            .btn, .level-btn, .input-group input, .feedback { transition: none; }
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <a href="../index.html">&#8592; Index</a>
        <span class="sheet-tag">projects.colmryan.org &middot; Kids</span>
    </nav>
    <div class="card">
        <h1>What Time Is It?</h1>
        <p class="subtitle">Learn to read an analog clock</p>

        <div class="level-bar" role="group" aria-label="Difficulty level">
            <button class="level-btn active" data-level="1" aria-pressed="true">Hours</button>
            <button class="level-btn" data-level="2" aria-pressed="false">Quarter</button>
            <button class="level-btn" data-level="3" aria-pressed="false">Fives</button>
            <button class="level-btn" data-level="4" aria-pressed="false">Any Minute</button>
        </div>

        <div class="streak-display" aria-live="polite" aria-label="Current streak">
        </div>

        <div class="clock-container">
            <canvas id="clock" width="336" height="336"></canvas>
            <div class="legend">
                <span class="legend-item"><span class="legend-swatch hour"></span> Hour</span>
                <span class="legend-item"><span class="legend-swatch minute"></span> Minute</span>
            </div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label for="hour-input">Hour</label>
                <input type="text" id="hour-input" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="--" aria-label="Hour (1 to 12)">
            </div>
            <span class="colon" id="colon">:</span>
            <div class="input-group" id="minute-group">
                <label for="minute-input">Minute</label>
                <input type="text" id="minute-input" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="--" aria-label="Minute (0 to 59)">
            </div>
        </div>

        <div id="feedback" class="feedback" aria-live="polite"></div>

        <button class="btn btn-check" id="check-btn" aria-label="Check your answer">Check</button>
        <button class="btn btn-next" id="next-btn" aria-label="Next question">Next</button>

        <div id="level-up-msg"></div>
    </div>

    <footer>
        Drawn by Colm Ryan &middot; with LLM help &middot; <a href="../index.html">All projects</a>
    </footer>

    <script>
        const CHEERFUL = [
            "Great job!", "You got it!", "Awesome!", "Nice work!",
            "Correct!", "Well done!", "Fantastic!", "Superb!"
        ];

        const ENCOURAGE = [
            "Not quite — try again!", "Almost! Keep going!",
            "Oops! Let's try another.", "Good effort!"
        ];

        const ADVANCE_THRESHOLD = 5;
        const MAX_LEVEL = 4;

        const state = {
            level: 1,
            currentHour: 0,
            currentMinute: 0,
            streak: 0,
            bestStreak: 0,
            answered: false
        };

        const canvas = document.getElementById('clock');
        const ctx = canvas.getContext('2d');
        const hourInput = document.getElementById('hour-input');
        const minuteInput = document.getElementById('minute-input');
        const minuteGroup = document.getElementById('minute-group');
        const colonEl = document.getElementById('colon');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedbackEl = document.getElementById('feedback');
        const streakEl = document.querySelector('.streak-display');
        const levelUpEl = document.getElementById('level-up-msg');
        const clockContainer = document.querySelector('.clock-container');

        // Level buttons
        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setLevel(parseInt(btn.dataset.level));
            });
        });

        // Only allow digit characters in inputs
        [hourInput, minuteInput].forEach(input => {
            input.addEventListener('input', () => {
                input.value = input.value.replace(/[^0-9]/g, '');
            });
        });

        checkBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', nextQuestion);

        // Enter key submits
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (state.answered) {
                    nextQuestion();
                } else {
                    checkAnswer();
                }
            }
        });

        function setLevel(level) {
            state.level = level;
            state.streak = 0;

            document.querySelectorAll('.level-btn').forEach(b => {
                const isActive = parseInt(b.dataset.level) === level;
                b.classList.toggle('active', isActive);
                b.setAttribute('aria-pressed', isActive);
            });

            updateStreak();
            levelUpEl.textContent = '';
            nextQuestion();
        }

        function generateTime(level) {
            const hour = Math.floor(Math.random() * 12) + 1;
            let minute = 0;

            if (level === 1) {
                minute = 0;
            } else if (level === 2) {
                minute = [0, 15, 30, 45][Math.floor(Math.random() * 4)];
            } else if (level === 3) {
                minute = Math.floor(Math.random() * 12) * 5;
            } else {
                minute = Math.floor(Math.random() * 60);
            }

            return { hour, minute };
        }

        // read a design token so the canvas clock follows the page palette
        function cssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function drawClock(hour, minute) {
            const size = canvas.width;
            const cx = size / 2;
            const cy = size / 2;
            const r = size / 2 - 10;

            const inkColor = cssVar('--ink');
            const tickColor = cssVar('--muted');
            const faceColor = cssVar('--well');
            const hourColor = cssVar('--crayon-blue');
            const minuteColor = cssVar('--crayon-red');

            ctx.clearRect(0, 0, size, size);

            // Face
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = faceColor;
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = inkColor;
            ctx.stroke();

            // Tick marks
            for (let i = 0; i < 60; i++) {
                const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
                const isHour = i % 5 === 0;
                const innerR = isHour ? r - 16 : r - 8;
                const outerR = r - 3;

                ctx.beginPath();
                ctx.moveTo(cx + innerR * Math.cos(angle), cy + innerR * Math.sin(angle));
                ctx.lineTo(cx + outerR * Math.cos(angle), cy + outerR * Math.sin(angle));
                ctx.lineWidth = isHour ? 3 : 1;
                ctx.strokeStyle = isHour ? inkColor : tickColor;
                ctx.stroke();
            }

            // Numbers
            ctx.fillStyle = inkColor;
            ctx.font = '500 22px "IBM Plex Mono", ui-monospace, monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let n = 1; n <= 12; n++) {
                const angle = (n / 12) * Math.PI * 2 - Math.PI / 2;
                const numR = r - 32;
                ctx.fillText(n, cx + numR * Math.cos(angle), cy + numR * Math.sin(angle));
            }

            // Center dot
            ctx.beginPath();
            ctx.arc(cx, cy, 6, 0, Math.PI * 2);
            ctx.fillStyle = inkColor;
            ctx.fill();

            // Hour hand
            const hourAngle = ((hour % 12) / 12 + minute / 720) * Math.PI * 2 - Math.PI / 2;
            const hourLen = r * 0.5;
            drawHand(cx, cy, hourAngle, hourLen, 7, hourColor);

            // Minute hand
            const minuteAngle = (minute / 60) * Math.PI * 2 - Math.PI / 2;
            const minuteLen = r * 0.75;
            drawHand(cx, cy, minuteAngle, minuteLen, 4, minuteColor);

            // Center cap
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fillStyle = inkColor;
            ctx.fill();
        }

        function drawHand(cx, cy, angle, length, width, color) {
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + length * Math.cos(angle), cy + length * Math.sin(angle));
            ctx.lineWidth = width;
            ctx.strokeStyle = color;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        function checkAnswer() {
            if (state.answered) return;

            const h = parseInt(hourInput.value);
            const m = state.level === 1 ? 0 : parseInt(minuteInput.value);

            if (isNaN(h) || h < 1 || h > 12) {
                feedbackEl.textContent = 'Enter an hour (1–12)';
                feedbackEl.className = 'feedback incorrect';
                return;
            }

            if (state.level > 1 && (isNaN(m) || m < 0 || m > 59)) {
                feedbackEl.textContent = 'Enter minutes (0–59)';
                feedbackEl.className = 'feedback incorrect';
                return;
            }

            state.answered = true;
            const correct = h === state.currentHour && m === state.currentMinute;

            if (correct) {
                state.streak++;
                if (state.streak > state.bestStreak) state.bestStreak = state.streak;

                feedbackEl.textContent = CHEERFUL[Math.floor(Math.random() * CHEERFUL.length)];
                feedbackEl.className = 'feedback correct';

                canvas.classList.add('clock-correct');
                setTimeout(() => canvas.classList.remove('clock-correct'), 600);

                // Auto-advance
                if (state.streak >= ADVANCE_THRESHOLD && state.level < MAX_LEVEL) {
                    const newLevel = state.level + 1;
                    levelUpEl.textContent = `Level up! Moving to Level ${newLevel}`;
                    levelUpEl.className = 'level-up-msg';
                    state.streak = 0;
                    setTimeout(() => {
                        setLevel(newLevel);
                    }, 1500);
                    return;
                }
            } else {
                state.streak = 0;
                const correctStr = formatTime(state.currentHour, state.currentMinute);
                const msg = ENCOURAGE[Math.floor(Math.random() * ENCOURAGE.length)];
                feedbackEl.textContent = `${msg} It was ${correctStr}`;
                feedbackEl.className = 'feedback incorrect';

                canvas.classList.add('clock-shake');
                setTimeout(() => canvas.classList.remove('clock-shake'), 500);
            }

            updateStreak();
            checkBtn.style.display = 'none';
            nextBtn.style.display = 'inline-block';
            nextBtn.focus();
        }

        function formatTime(h, m) {
            return `${h}:${String(m).padStart(2, '0')}`;
        }

        function nextQuestion() {
            const time = generateTime(state.level);
            state.currentHour = time.hour;
            state.currentMinute = time.minute;
            state.answered = false;

            drawClock(time.hour, time.minute);

            hourInput.value = '';
            minuteInput.value = '';
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
            levelUpEl.textContent = '';

            checkBtn.style.display = 'inline-block';
            nextBtn.style.display = 'none';

            // Hide minute input at level 1
            const hideMinute = state.level === 1;
            minuteGroup.style.display = hideMinute ? 'none' : '';
            colonEl.style.display = hideMinute ? 'none' : '';

            hourInput.focus();
        }

        function updateStreak() {
            let stars = '';
            for (let i = 0; i < state.streak; i++) {
                stars += '<span class="star pop" style="animation-delay:' + (i * 0.05) + 's">&#11088;</span>';
            }
            streakEl.innerHTML = stars || '&nbsp;';
        }

        function init() {
            updateStreak();
            nextQuestion();
        }

        init();

        // redraw once the web fonts arrive so the clock numbers use them,
        // and when the color scheme flips so the canvas matches the palette
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => drawClock(state.currentHour, state.currentMinute));
        }
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)')
                .addEventListener('change', () => drawClock(state.currentHour, state.currentMinute));
        }
    </script>
</body>
</html>
